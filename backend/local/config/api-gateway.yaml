server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # /api/v1/account/auth/login -> account-service /account/auth/login
            - id: account-service
              uri: http://localhost:9010
              predicates: [ "Path=/api/v1/account/**" ]
              filters: [ "StripPrefix=2" ]
            - id: workspace-service
              uri: http://localhost:9020
              predicates: [ "Path=/api/v1/workspace/**" ]
              filters: [ "StripPrefix=2" ]
            - id: intelligence-service
              uri: http://localhost:9030
              predicates: [ "Path=/api/v1/intelligence/**" ]
              filters: [ "StripPrefix=2" ]

app:
  security:
    public-routes:
      - /api/v1/account/auth/**
      - /api/v1/account/webhooks/**
      - /actuator/**
