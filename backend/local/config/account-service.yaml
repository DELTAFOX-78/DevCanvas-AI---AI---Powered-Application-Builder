server:
  port: 9010
  servlet:
    context-path: /account

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/account_db
    username: lovable
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

stripe:
  api:
    secret: ${STRIPE_API_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

app:
  frontend:
    url: http://localhost:5173
